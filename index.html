    <script>
      (function () {
        try {
          var storedLang = localStorage.getItem('takhayal-lang');
          var lang = storedLang === 'en' ? 'en' : 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (_) {}
      })();
    </script>

  <body>
    <script>
      (function(){
        var p=window.location.pathname;
        var s=localStorage.getItem('takhayal-theme')||'dark';
        if(p.startsWith('/admin')){s='dark'}
        document.documentElement.setAttribute('data-theme',s);
        document.documentElement.classList.toggle('dark',s==='dark');
        document.documentElement.classList.toggle('light',s==='light');
      })()
    </script>
